<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Services — CareSphere Admin</title>
<link rel="icon" href="../images/logo.png" type="image/png">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><img src="../images/logo.png" alt="" onerror="this.style.display='none'"><span>Care<em>Sphere</em></span></div>
    <div class="sidebar-label">Main</div>
    <a href="index.html"     class="nav-item"><i class="fas fa-gauge-high"></i> Dashboard</a>
    <a href="blogs.html"     class="nav-item"><i class="fas fa-newspaper"></i> Blog Posts</a>
    <a href="services.html"  class="nav-item active"><i class="fas fa-hand-holding-medical"></i> Services</a>
    <a href="events.html"    class="nav-item"><i class="fas fa-calendar-days"></i> Events</a>
    <a href="resources.html" class="nav-item"><i class="fas fa-book-medical"></i> Health Resources</a>
    <div class="sidebar-label">Management</div>
    <a href="team.html"      class="nav-item"><i class="fas fa-users"></i> Team Members</a>
    <a href="analytics.html" class="nav-item"><i class="fas fa-chart-line"></i> Analytics</a>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="sidebar-avatar" id="sidebarAvatar">A</div><div class="sidebar-user-info"><div class="name" id="sidebarName">Admin</div><div class="role">Administrator</div></div></div>
      <button class="logout-btn" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Sign Out</button>
    </div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:1rem"><button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button><span class="topbar-title">Services</span></div>
      <div class="topbar-right"><button class="btn btn-green btn-sm" id="newBtn"><i class="fas fa-plus"></i> New Service</button></div>
    </header>
    <div class="page-body">
      <div class="table-card">
        <div class="table-header"><h3>All Services</h3>
          <div class="table-search"><input type="text" id="searchInput" placeholder="Search…"></div>
        </div>
        <table>
          <thead><tr><th>Icon</th><th>Service Name</th><th>Category</th><th>Status</th><th>Order</th><th>Actions</th></tr></thead>
          <tbody id="dataTable"><tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-muted)"><i class="fas fa-spinner fa-spin"></i></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="mainModal">
  <div class="modal">
    <div class="modal-header"><h3 id="modalTitle">New Service</h3><button class="modal-close" id="closeModal"><i class="fas fa-xmark"></i></button></div>
    <div class="modal-body">
      <div id="modalAlert" style="display:none" class="alert"></div>
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group">
          <label>Icon (emoji or FA class)</label>
          <input type="text" id="fIcon" placeholder="💻 or fas fa-laptop-medical">
        </div>
        <div class="form-group">
          <label>Display Order</label>
          <input type="number" id="fOrder" value="1" min="1">
        </div>
      </div>
      <div class="form-group"><label>Service Title *</label><input type="text" id="fTitle" placeholder="e.g. Telemedicine Consultations" required></div>
      <div class="form-group">
        <label>Category</label>
        <select id="fCategory">
          <option value="Individual Services">Individual Services</option>
          <option value="Community Programs">Community Programs</option>
          <option value="Support & Education">Support & Education</option>
        </select>
      </div>
      <div class="form-group"><label>Short Description *</label><textarea id="fDesc" rows="3" placeholder="One-paragraph description shown on the services page…"></textarea></div>
      <div class="form-group"><label>Full Details (optional)</label><textarea id="fDetails" rows="4" placeholder="Detailed explanation, eligibility, how it works…"></textarea></div>
      <div class="form-group"><label>CTA Button Text</label><input type="text" id="fCta" placeholder="Learn More, Book Now…"></div>
      <label class="toggle-wrap">
        <div class="toggle"><input type="checkbox" id="fPublished"><span class="toggle-slider"></span></div>
        <span class="toggle-label">Publish this service</span>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-green" id="saveBtn"><i class="fas fa-floppy-disk"></i> Save Service</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header"><h3>Delete Service</h3><button class="modal-close" id="closeDeleteModal"><i class="fas fa-xmark"></i></button></div>
    <div class="modal-body"><p>Delete <strong id="deleteTitle"></strong>?</p></div>
    <div class="modal-footer"><button class="btn btn-ghost" id="cancelDeleteBtn">Cancel</button><button class="btn btn-danger" id="confirmDeleteBtn"><i class="fas fa-trash"></i> Delete</button></div>
  </div>
</div>
<div id="toast-container"></div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, query, orderBy }
                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut }
                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FC={apiKey:"AIzaSyBwq7tPqEgv446a9p6I25oyXznwlEIwcwc",authDomain:"carespher.firebaseapp.com",projectId:"carespher",storageBucket:"carespher.firebasestorage.app",messagingSenderId:"1063379902456",appId:"1:1063379902456:web:f26ebd2dcbde18e86a000d"};
const app=initializeApp(FC);const db=getFirestore(app);const auth=getAuth(app);

onAuthStateChanged(auth,async(user)=>{
  if(!user)return location.href="login.html";
  const snap=await getDoc(doc(db,"admin_users",user.uid));
  if(!snap.exists()){await signOut(auth);return location.href="login.html";}
  const d=snap.data();document.getElementById("sidebarName").textContent=`${d.firstName||""} ${d.lastName||""}`.trim();
  document.getElementById("sidebarAvatar").textContent=(d.firstName||"A")[0].toUpperCase();loadData();
});
document.getElementById("logoutBtn").addEventListener("click",async()=>{await signOut(auth);location.href="login.html";});
document.getElementById("menuToggle").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
if(new URLSearchParams(location.search).get("new")==="1")openModal();

let allItems=[],deleteTargetId=null;

async function loadData(){
  const snap=await getDocs(query(collection(db,"services"),orderBy("order","asc")));
  allItems=snap.docs.map(d=>({id:d.id,...d.data()}));renderTable(allItems);
}
function renderTable(items){
  const tbody=document.getElementById("dataTable");
  if(!items.length){tbody.innerHTML=`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🏥</div><h3>No services yet</h3></div></td></tr>`;return;}
  tbody.innerHTML=items.map(p=>`<tr>
    <td style="font-size:1.4rem;text-align:center">${p.icon||"💊"}</td>
    <td><div class="td-title">${p.title||"Untitled"}</div></td>
    <td><span style="font-size:0.83rem;color:var(--text-muted)">${p.category||"—"}</span></td>
    <td><span class="badge badge-${p.status==="published"?"published":"draft"}">${p.status||"draft"}</span></td>
    <td style="text-align:center;color:var(--text-muted);font-size:0.88rem">${p.order||1}</td>
    <td><div class="td-actions">
      <button class="btn btn-outline btn-sm" onclick="editItem('${p.id}')"><i class="fas fa-pen"></i></button>
      <button class="btn btn-danger btn-sm"  onclick="confirmDelete('${p.id}','${(p.title||"").replace(/'/g,"\\'")}')"><i class="fas fa-trash"></i></button>
    </div></td>
  </tr>`).join("");
}
document.getElementById("searchInput").addEventListener("input",()=>{const q=document.getElementById("searchInput").value.toLowerCase();renderTable(allItems.filter(p=>(!q||(p.title||"").toLowerCase().includes(q))));});

function openModal(item=null){
  document.getElementById("modalTitle").textContent=item?"Edit Service":"New Service";
  document.getElementById("editId").value=item?.id||"";
  document.getElementById("fTitle").value=item?.title||"";
  document.getElementById("fIcon").value=item?.icon||"";
  document.getElementById("fOrder").value=item?.order||1;
  document.getElementById("fCategory").value=item?.category||"Individual Services";
  document.getElementById("fDesc").value=item?.description||"";
  document.getElementById("fDetails").value=item?.details||"";
  document.getElementById("fCta").value=item?.ctaText||"Learn More";
  document.getElementById("fPublished").checked=item?.status==="published";
  document.getElementById("modalAlert").style.display="none";
  document.getElementById("mainModal").classList.add("open");
}
window.editItem=(id)=>{const p=allItems.find(x=>x.id===id);if(p)openModal(p);};
document.getElementById("closeModal").addEventListener("click",()=>document.getElementById("mainModal").classList.remove("open"));
document.getElementById("cancelBtn").addEventListener("click",()=>document.getElementById("mainModal").classList.remove("open"));
document.getElementById("newBtn").addEventListener("click",()=>openModal());

document.getElementById("saveBtn").addEventListener("click",async()=>{
  const btn=document.getElementById("saveBtn");
  const title=document.getElementById("fTitle").value.trim();
  const desc=document.getElementById("fDesc").value.trim();
  if(!title||!desc)return showAlert("Title and description are required.");
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving…';
  const id=document.getElementById("editId").value;
  const data={title,icon:document.getElementById("fIcon").value.trim(),order:parseInt(document.getElementById("fOrder").value)||1,category:document.getElementById("fCategory").value,description:desc,details:document.getElementById("fDetails").value.trim(),ctaText:document.getElementById("fCta").value.trim()||"Learn More",status:document.getElementById("fPublished").checked?"published":"draft"};
  try{
    if(id)await updateDoc(doc(db,"services",id),{...data,updatedAt:new Date().toISOString()});
    else await addDoc(collection(db,"services"),{...data,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    toast("Saved ✓","success");document.getElementById("mainModal").classList.remove("open");await loadData();
  }catch(e){showAlert("Error: "+e.message);}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-floppy-disk"></i> Save Service';
});

window.confirmDelete=(id,title)=>{deleteTargetId=id;document.getElementById("deleteTitle").textContent=title;document.getElementById("deleteModal").classList.add("open");};
document.getElementById("closeDeleteModal").addEventListener("click",()=>document.getElementById("deleteModal").classList.remove("open"));
document.getElementById("cancelDeleteBtn").addEventListener("click",()=>document.getElementById("deleteModal").classList.remove("open"));
document.getElementById("confirmDeleteBtn").addEventListener("click",async()=>{if(!deleteTargetId)return;await deleteDoc(doc(db,"services",deleteTargetId));document.getElementById("deleteModal").classList.remove("open");toast("Deleted","default");await loadData();});

function showAlert(msg){const a=document.getElementById("modalAlert");a.className="alert alert-error";a.innerHTML=`<i class="fas fa-circle-exclamation"></i><span>${msg}</span>`;a.style.display="flex";}
function toast(msg,type="default"){const c=document.getElementById("toast-container");const t=document.createElement("div");t.className=`toast ${type}`;t.innerHTML=`<i class="fas fa-check-circle"></i> ${msg}`;c.appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="all 0.3s";setTimeout(()=>t.remove(),300);},3500);}
</script>
</body>
</html>
